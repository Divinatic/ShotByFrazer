<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Booking — Shot By Frazer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html {
  font-size: clamp(14px, 1vw, 16px);
  -webkit-text-size-adjust: 100%;
}
body {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: geometricPrecision;
}

:root {
  --bg: #f4f4f4;
  --panel: #ffffff;
  --text: #111;
  --muted: #777;
  --accent: #3b82f6;
  --line: #ccc;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  background: #dcdcdc;
  color: var(--text);
}

/* FRAME */
.frame {
  width: 92%;
  height: 86vh;
  margin: 7vh auto;
  background: var(--bg);
  box-shadow: 0 40px 80px rgba(0,0,0,0.15);
  display: grid;
  grid-template-columns: 260px 1fr;
  position: relative;
}

/* SIDEBAR */
.sidebar {
  padding: 50px 35px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: #f8f8f8;
}

.booking-layout {
  display: grid;
  grid-template-columns: 1fr 420px;
  gap: 70px;
  align-items: flex-start;
}

.booking-image {
  width: 100%;
  height: 560px;
  overflow: hidden;
  border-radius: 8px;
  background: #ddd;
}

.booking-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity 0.8s ease, transform 0.8s ease;
}

.booking-image img.fade-out {
  opacity: 0;
  transform: scale(1.03);
}

@media (max-width: 900px) {
  .booking-layout {
    grid-template-columns: 1fr;
  }
  .booking-image {
    height: 300px;
  }
}

.brand-logo img {
  width: 180px;
}

.nav {
  margin-top: 60px;
  list-style: none;
}

.nav a {
  text-decoration: none;
  color: var(--muted);
}

.nav li {
  margin-bottom: 18px;
  font-size: 12px;
  letter-spacing: 0.22em;
}

.accent-line {
  position: absolute;
  left: 260px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(to bottom, var(--accent), transparent);
}

.main {
  padding: 50px 60px;
  position: relative;
}

.booking {
  max-width: 520px;
}

.booking h1 {
  font-size: 22px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 16px;
}

.booking p {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 36px;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.day-option {
  width: 60px;
  padding: 14px 0;
  text-align: center;
  border: 1px solid #ccc;
  cursor: pointer;
  font-size: 12px;
  text-transform: uppercase;
}

.day-option input {
  display: none;
}

.day-option:has(input:checked) {
  background: #111;
  color: #fff;
  border-color: #111;
}

form {
  display: grid;
  gap: 22px;
}

label {
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
}

input,
textarea {
  width: 100%;
  padding: 12px 0;
  font-size: 14px;
  border: none;
  border-bottom: 1px solid #ccc;
  background: transparent;
}

button {
  margin-top: 20px;
  padding: 14px 0;
  font-size: 12px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  background: transparent;
  border: 1px solid #111;
  cursor: pointer;
}

button:hover {
  background: #111;
  color: #fff;
}

.footer-brand {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  letter-spacing: 0.45em;
  text-transform: uppercase;
  color: rgba(0,0,0,0.35);
}
</style>
</head>

<body>
<div class="frame">
  <div class="accent-line"></div>

  <aside class="sidebar">
    <div>
      <div class="brand-logo">
        <img src="images/sbflogo.png" alt="SBF Logo">
      </div>

      <ul class="nav">
        <li><a href="index.html">HOMEPAGE</a></li>
        <li><a href="booking.html">BOOKING</a></li>
        <li><a href="portfolio.html">PORTFOLIO</a></li>
        <li><a href="index.html#contact">CONTACT</a></li>
      </ul>
    </div>

    <div style="font-size:11px;color:#999;">
      © 2025 ShotByFrazer
    </div>
  </aside>

  <main class="main">
    <div class="booking-layout">

      <section class="booking">
        <h1>Booking</h1>
        <p>Select a day that suits you and leave your details below.</p>

        <!-- ✅ FORM UPDATED -->
        <form id="bookingForm" action="https://formspree.io/f/xnjjqeyw" method="POST">

          <div class="calendar-grid">
            <label class="day-option"><input type="radio" name="date" value="Mon" required><span>Mon</span></label>
            <label class="day-option"><input type="radio" name="date" value="Tue"><span>Tue</span></label>
            <label class="day-option"><input type="radio" name="date" value="Wed"><span>Wed</span></label>
            <label class="day-option"><input type="radio" name="date" value="Thu"><span>Thu</span></label>
            <label class="day-option"><input type="radio" name="date" value="Fri"><span>Fri</span></label>
            <label class="day-option"><input type="radio" name="date" value="Sat"><span>Sat</span></label>
          </div>

          <div>
            <label>Name</label>
            <input type="text" name="name" required>
          </div>

          <div>
            <label>Email</label>
            <input type="email" name="email" required>
          </div>

          <div>
            <label>Notes</label>
            <textarea name="message"></textarea>
          </div>

          <button type="submit">Request Booking</button>
        </form>
      </section>

      <div class="booking-image">
        <img id="bookingSlideshow" src="images/frazer1.jpg" alt="">
      </div>

    </div>

    <div class="footer-brand">Shot By Frazer</div>
  </main>
</div>

<script>
/* slideshow */
const bookingImages = [
  "images/frazer1.jpg","images/frazer2.jpg","images/frazer3.jpg",
  "images/frazer4.jpg","images/frazer5.jpg","images/frazer6.jpg",
  "images/frazer7.jpg","images/frazer8.jpg","images/frazer9.jpg",
  "images/frazer10.jpg","images/frazer11.jpg","images/frazer12.jpg",
  "images/frazer13.jpg","images/frazer.jpg"
];

let index = 0;
const img = document.getElementById("bookingSlideshow");

setInterval(() => {
  img.classList.add("fade-out");
  setTimeout(() => {
    index = (index + 1) % bookingImages.length;
    img.src = bookingImages[index];
    img.classList.remove("fade-out");
  }, 400);
}, 3500);

/* ✅ FORM HANDLER */
const form = document.getElementById("bookingForm");

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  const formData = new FormData(form);

  try {
    await fetch(form.action, {
      method: "POST",
      body: formData,
      headers: { "Accept": "application/json" }
    });

    window.location.href = "thankyou.html";

  } catch (err) {
    alert("Submission failed. Please try again.");
  }
});
</script>

</body>
</html>
