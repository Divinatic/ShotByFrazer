<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Booking — Shot By Frazer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html {
  font-size: clamp(14px, 1vw, 16px);
  -webkit-text-size-adjust: 100%;
}
body {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: geometricPrecision;
}

:root {
  --bg: #f4f4f4;
  --panel: #ffffff;
  --text: #111;
  --muted: #777;
  --accent: #3b82f6;
  --line: #ccc;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  background: #dcdcdc;
  color: var(--text);
}

/* FRAME */
.frame {
  width: 92%;
  height: 86vh;
  margin: 7vh auto;
  background: var(--bg);
  box-shadow: 0 40px 80px rgba(0,0,0,0.15);
  display: grid;
  grid-template-columns: 260px 1fr;
  position: relative;
}

/* SIDEBAR */
.sidebar {
  padding: 50px 35px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: #f8f8f8;
}

.brand-logo img {
  width: 180px;
  height: auto;
  display: block;
}

.nav {
  margin-top: 60px;
  list-style: none;
}

.nav a {
  text-decoration: none;
  color: var(--muted);
  cursor: pointer;
  transition: color 0.25s ease;
}

.nav a:hover {
  color: var(--text);
}

.nav li {
  margin-bottom: 18px;
  font-size: 12px;
  letter-spacing: 0.22em;
  color: var(--muted);
  cursor: pointer;
  position: relative;
  transition: color 0.25s ease;
}

.nav li::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -6px;
  width: 0%;
  height: 1px;
  background: var(--accent);
  transition: width 0.25s ease;
}

.nav li:hover {
  color: var(--text);
}

.nav li:hover::after {
  width: 100%;
}

/* ACCENT LINE */
.accent-line {
  position: absolute;
  left: 260px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(to bottom, var(--accent), transparent);
}

/* MAIN */
.main {
  padding: 50px 60px;
  position: relative;
}

/* ===== BOOKING PAGE ONLY ===== */

.booking {
  max-width: 520px;
}

.booking h1 {
  font-size: 22px;
  font-weight: 400;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 16px;
}

.booking p {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.7;
  margin-bottom: 36px;
}

/* CALENDAR */
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.calendar-grid label {
  display: inline-block;
  width: 60px;
  padding: 14px 0;
  text-align: center;
  border: 1px solid #ccc;
  cursor: pointer;
  font-size: 12px;
  text-transform: uppercase;
  transition: background 0.25s ease, color 0.25s ease;
}

.calendar-grid input {
  display: none;
}

.calendar-grid input:checked + span {
  background: #111;
  color: #fff;
}

/* FORM */
form {
  display: grid;
  gap: 22px;
}

label {
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
}

input,
textarea {
  width: 100%;
  padding: 12px 0;
  font-size: 14px;
  border: none;
  border-bottom: 1px solid #ccc;
  background: transparent;
  outline: none;
  font-family: inherit;
}

input:focus,
textarea:focus {
  border-bottom-color: var(--accent);
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  margin-top: 20px;
  padding: 14px 0;
  font-size: 12px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  background: transparent;
  border: 1px solid #111;
  cursor: pointer;
  transition: background 0.25s ease, color 0.25s ease;
}

button:hover {
  background: #111;
  color: #fff;
}

/* FOOTER BRAND */
.footer-brand {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  letter-spacing: 0.45em;
  text-transform: uppercase;
  color: rgba(0,0,0,0.35);
  pointer-events: none;
}
</style>

</head>

<body>
<div class="frame">
  <div class="accent-line"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div>
      <div class="brand-logo">
        <img src="images/sbflogo.png" alt="SBF Logo">
      </div>

      <ul class="nav">
        <li><a href="index.html">HOMEPAGE</a></li>
        <li><a href="booking.html">BOOKING</a></li>
        <li><a href="portfolio.html">PORTFOLIO</a></li>
        <li><a href="index.html#contact">CONTACT</a></li>
      </ul>
    </div>

    <div style="font-size:11px;color:#999;">
      2025, Rights Reserved by SBF
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <section class="booking">
      <h1>Booking</h1>
      <p>
        Select a day that suits you and leave your details below.
        I’ll be in touch to confirm availability.
      </p>

      <!-- FORMSPREE FORM -->
      <form action="https://formspree.io/f/xnjjqeyw" method="POST">
        <div class="calendar-grid">
          <label>
            <input type="radio" name="date" value="Mon" required><span>Mon</span>
          </label>
          <label>
            <input type="radio" name="date" value="Tue"><span>Tue</span>
          </label>
          <label>
            <input type="radio" name="date" value="Wed"><span>Wed</span>
          </label>
          <label>
            <input type="radio" name="date" value="Thu"><span>Thu</span>
          </label>
          <label>
            <input type="radio" name="date" value="Fri"><span>Fri</span>
          </label>
          <label>
            <input type="radio" name="date" value="Sat"><span>Sat</span>
          </label>
        </div>

        <div>
          <label>Name</label>
          <input type="text" name="name" required>
        </div>

        <div>
          <label>Email</label>
          <input type="email" name="email" required>
        </div>

        <div>
          <label>Notes</label>
          <textarea name="message" placeholder="Car, location, time preference, etc."></textarea>
        </div>

        <button type="submit">Request Booking</button>
      </form>
    </section>

    <div class="footer-brand">Shot By Frazer</div>
  </main>
</div>
</body>
</html>
